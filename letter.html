
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Veza Hospital - Official Letterhead</title>

<style>
* {
    box-sizing: border-box;
}

@page {
    size: A4 portrait;
    margin: 0;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9edf2;
    color: #172334;
}

.toolbar {
    text-align: center;
    padding: 14px;
    background: #144c91;
}

.toolbar button {
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    background: #168a36;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.page {
    width: 210mm;
    height: 297mm;
    margin: 12px auto;
    padding: 0 15mm 15mm;
    background: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px #aaa;
    isolation: isolate;
}

/* LARGE, FAINT VEZA WATERMARK */
.page::before {
    content: "";
    position: absolute;
    z-index: -1;
    width: 125mm;
    height: 125mm;
    left: 50%;
    top: 57%;
    transform: translate(-50%, -50%);
    background-image: url("veza.jpg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.075;
    pointer-events: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

/* LETTERHEAD */
.letterhead {
    width: calc(100% + 30mm);
    margin-left: -15mm;
    padding: 5mm 8mm 3mm;
    border-top: 2px solid #168a36;
    position: relative;
    z-index: 1;
    background: white;
}

.header-grid {
    display: grid;
    grid-template-columns: 32mm minmax(0, 1fr) 32mm;
    align-items: center;
    gap: 5mm;
    min-height: 38mm;
}

.logo {
    width: 32mm;
    height: 32mm;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    display: block;
    max-width: 100%;
    max-height: 32mm;
    object-fit: contain;
}

/* MOH LOGO ON THE OPPOSITE SIDE */
.logo-right {
    justify-self: end;
}

.hospital-heading {
    text-align: center;
    line-height: 1.25;
    min-width: 0;
}

.country {
    font-size: 10pt;
    font-weight: bold;
    color: #144c91;
    margin-bottom: 2mm;
}

.hospital-heading h1 {
    margin: 0 0 2mm;
    font-size: 23pt;
    font-weight: 900;
    color: #0877d1;
    white-space: nowrap;
}

.motto {
    font-size: 10pt;
    font-weight: bold;
    font-style: italic;
    color: #168a36;
    margin-bottom: 3mm;
}

.contact {
    font-size: 9pt;
    font-weight: bold;
    line-height: 1.6;
    color: #222;
}

.colour-bars {
    margin-top: 2mm;
}

.bar-one {
    height: 2.5mm;
    background: linear-gradient(
        to right,
        #0877d1 0%,
        #0877d1 62%,
        #ffffff 62%,
        #ffffff 63%,
        #168a36 63%,
        #168a36 100%
    );
    margin-bottom: 2mm;
}

.bar-two {
    height: 1.3mm;
    background: #168a36;
}

/* BLANK WRITING AREA: NO LINES OR BORDERS */
.writing-area {
    position: relative;
    z-index: 1;
    height: 245mm;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
}

/* FOOTER */
.footer {
    position: absolute;
    bottom: 5mm;
    left: 15mm;
    right: 15mm;
    padding: 2.5mm 2mm;
    border-top: 1.5mm solid #168a36;
    background: #144c91;
    text-align: center;
    font-size: 8.5pt;
    font-weight: bold;
    color: white;
    z-index: 1;
}

@media print {
    html, body {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 0;
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .toolbar {
        display: none !important;
    }

    .page {
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
        page-break-after: avoid;
        break-after: avoid;
    }

    .letterhead {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}
</style>
</head>

<body>

<div class="toolbar">
    <button type="button" onclick="window.print()">
        PRINT / SAVE AS PDF
    </button>
</div>

<div class="page">

    <header class="letterhead">

        <div class="header-grid">

            <!-- LEFT: VEZA HOSPITAL LOGO -->
            <div class="logo">
                <img src="veza.jpg" alt="GM Veza Hospital Logo">
            </div>

            <!-- CENTRE: HOSPITAL DETAILS -->
            <div class="hospital-heading">

                <div class="country">HEALTHCARE SERVICES</div>

                <h1>GM VEZA HOSPITAL</h1>

                <div class="motto">
                    Your trusted health partner in recovery
                </div>

                <div class="contact">
                    TEL: 0715513893<br>
                    EMAIL: gmvezahospital40@gmail.com
                </div>

            </div>

            <!-- RIGHT: MINISTRY OF HEALTH LOGO -->
            <div class="logo logo-right">
                <img src="moh.png" alt="Ministry of Health Logo">
            </div>

        </div>

        <div class="colour-bars">
            <div class="bar-one"></div>
            <div class="bar-two"></div>
        </div>

    </header>

    <!-- BLANK BODY WITH FAINT VEZA WATERMARK -->
    <main class="writing-area"></main>

    <footer class="footer">
        GM VEZA HOSPITAL &nbsp; | &nbsp;
        YOUR TRUSTED HEALTH PARTNER IN RECOVERY
        &nbsp; | &nbsp; TEL: 0715513893
    </footer>

</div>

</body>
</html>
